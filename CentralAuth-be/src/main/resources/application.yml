spring:
  config:
    import: optional:file:../.env[.properties]

  application:
    name: central-auth

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/centralAuth}
    username: ${DATASOURCE_USERNAME:centralauth}
    password: ${DATASOURCE_PASSWORD:centralauth}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${CENTRALAUTH_REDIS_HOST:localhost}
      port: ${CENTRALAUTH_REDIS_PORT:6379}
      password: ${CENTRALAUTH_REDIS_PASSWORD:}
      timeout: 2s

  kafka:
    bootstrap-servers: ${CENTRALAUTH_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: central-auth-audit
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.centralauth.event.auth

mybatis:
  mapper-locations: classpath*:mappers/**/*.xml
  type-aliases-package: com.centralauth
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${PORT:8080}

centralauth:
  admin:
    bootstrap-emails: ${CENTRALAUTH_ADMIN_BOOTSTRAP_EMAILS:}
  email-verification:
    otp-ttl: ${CENTRALAUTH_EMAIL_VERIFICATION_OTP_TTL:10m}
    resend-cooldown: ${CENTRALAUTH_EMAIL_VERIFICATION_RESEND_COOLDOWN:60s}
  password-reset:
    token-ttl: ${CENTRALAUTH_PASSWORD_RESET_TOKEN_TTL:15m}
  jwt:
    secret: ${CENTRALAUTH_JWT_SECRET:cbdhhcbdhbcwhbhdcbdhcbhdbchdcbhdcccc}
    issuer: ${CENTRALAUTH_JWT_ISSUER:central-auth}
    expires-in-seconds: ${CENTRALAUTH_JWT_EXPIRES_IN_SECONDS:3600}
  refresh-token:
    expires-in-seconds: ${CENTRALAUTH_REFRESH_TOKEN_EXPIRES_IN_SECONDS:2592000}
  login-protection:
    max-failed-attempts: ${CENTRALAUTH_LOGIN_PROTECTION_MAX_FAILED_ATTEMPTS:5}
    failure-window: ${CENTRALAUTH_LOGIN_PROTECTION_FAILURE_WINDOW:15m}
    lock-duration: ${CENTRALAUTH_LOGIN_PROTECTION_LOCK_DURATION:15m}
    rate-limit:
      max-attempts: ${CENTRALAUTH_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:10}
      window: ${CENTRALAUTH_LOGIN_RATE_LIMIT_WINDOW:1m}
  kafka:
    audit:
      enabled: ${CENTRALAUTH_KAFKA_AUDIT_ENABLED:true}
    topics:
      user-registered: auth.user.registered
      user-verified: auth.user.verified
      login-succeeded: auth.user.login.succeeded
      login-failed: auth.user.login.failed
      logout: auth.user.logout
      password-reset-requested: auth.user.password.reset.requested
      password-changed: auth.user.password.changed
